apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}          # 新增：Service 自己的 label，ServiceMonitor 靠它找到这个 Service
spec:
  type: ClusterIP
  selector:
    app: {{ .Release.Name }}          # 原有的：Service 用它选择 Pod
  ports:
    - name: http                      # 新增：端口的名字，ServiceMonitor 按名字指定采集哪个端口
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
